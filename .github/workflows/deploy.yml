name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Private Firebase Config from Secret
        run: |
          if [ -n "${{ secrets.FIREBASE_CONFIG_JS }}" ]; then
            echo "${{ secrets.FIREBASE_CONFIG_JS }}" > firebase-config.js
            echo "✅ Private Firebase config injected from GitHub Secrets."
          else
            echo "⚠️ No secret found, using existing config if present."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
